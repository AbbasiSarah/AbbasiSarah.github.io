const game = document.getElementById('game');
const buttons = [...document.querySelectorAll('[data-view]')];
const offline = document.getElementById('offline');
const install = document.getElementById('install');
let installPrompt, current;
function show(name) {
  if (current === name) return;
  current = name;
  for (const button of buttons) button.setAttribute('aria-pressed',String(button.dataset.view===name));
  const utf8 = Uint8Array.from(atob(games[name]),c=>c.charCodeAt(0));
  game.srcdoc = new TextDecoder().decode(utf8);
  game.title = buttons.find(button=>button.dataset.view===name).textContent.trim();
}
buttons.forEach(button=>button.addEventListener('click',()=>show(button.dataset.view)));
show('arcade');
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt = event;
});
function checkInstalled() {
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)install.hidden=true;
}
checkInstalled();
window.addEventListener('appinstalled',()=>{install.hidden=true;installPrompt=null;});
install.addEventListener('click',async()=>{
  if(!installPrompt){document.getElementById('install-help').showModal();return;}
  const prompt=installPrompt;
  installPrompt=null;
  try { await prompt.prompt(); } catch { document.getElementById('install-help').showModal(); }
});
if(location.protocol!=='file:' && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('./shecodes-arcade-sw.js',{scope:'./arcade-app.html'}).then(()=>{
    return navigator.serviceWorker.ready;
  }).then(()=>{
    offline.textContent='Ready for offline play on this device.';
  }).catch(()=>{
    offline.textContent='Offline install unavailable in this browser.';
  });
}else{
  offline.textContent='The included games work in this file. Install requires the hosted version.';
}
</script>
