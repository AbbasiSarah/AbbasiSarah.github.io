<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SheCodesAI Arcade · Sara Abbasi</title>
<style>
:root{color-scheme:dark;--bg:#131020;--panel:#231938;--line:#564075;--ink:#fff5fb;--muted:#d1c3e3;--accent:#ffce75}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#492765,transparent 62%),var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
main{width:min(860px,calc(100% - 26px));margin:auto;padding:24px 0}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
header strong{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:12px}a{color:var(--accent)}
h1{letter-spacing:-.065em;font-size:clamp(42px,9vw,78px);line-height:.95;margin:25px 0 14px}
h2{margin:0;font-size:26px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.panel{border:1px solid var(--line);border-radius:15px;padding:clamp(15px,4vw,26px);background:var(--panel);box-shadow:0 7px #0b0814}
button{font:inherit;font-weight:700;color:var(--ink);background:#36284d;border:1px solid #796197;border-radius:9px;padding:9px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--accent);color:#27183a;border-color:var(--accent)}
p{color:var(--muted);line-height:1.5}p[role=status]{min-height:1.5em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:440px}.tiles button{aspect-ratio:1.22;font-size:clamp(21px,6vw,36px)}.tiles button.matched{border-color:#aaf592;background:#254638}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:460px}.lanes button{min-height:80px;font-size:28px}.lanes button.active{background:#573966;color:#ffe5a1;border-color:#ffe5a1}
#signal{display:block;width:min(100%,460px);min-height:124px;font-size:clamp(20px,5vw,30px)}#signal.wait{background:#722c4c}#signal.go{background:#b6f691;color:#172e17;border-color:#b6f691}
[hidden]{display:none!important}
</style>
<main>
<header><strong>SheCodesAI · Sara Abbasi</strong><nav aria-label="More games"><a href="./stack-sprint.html">Stack Sprint</a><a href="./coin-coil.html">Coin Coil</a></nav></header>
<h1>Arcade</h1>
<div class="tabs" role="group" aria-label="Choose a game">
<button type="button" data-game="memory" aria-pressed="true">Memory Match</button>
<button type="button" data-game="stars" aria-pressed="false">Star Catch</button>
<button type="button" data-game="react" aria-pressed="false">Quick Color</button>
</div>
<section class="panel" id="memory">
<h2>Memory Match</h2>
<p>Flip two cards at a time. Find all four pairs. Keyboard: 1–8.</p>
<div class="tiles" id="tiles"></div>
<p id="memory-status" role="status"></p><button type="button" class="primary" id="shuffle">New board</button>
</section>
<section class="panel" id="stars" hidden>
<h2>Star Catch</h2>
<p>Catch each star before it moves. Tap a lane or press 1, 2, or 3.</p>
<div class="lanes" id="lanes"><button type="button" aria-label="Lane 1">1</button><button type="button" aria-label="Lane 2">2</button><button type="button" aria-label="Lane 3">3</button></div>
<p id="star-status" role="status">20 seconds per round.</p><button type="button" class="primary" id="start-stars">Start round</button>
</section>
<section class="panel" id="react" hidden>
<h2>Quick Color</h2>
<p>Wait for green, then tap the panel or press Space.</p>
<button type="button" id="signal">Start</button><p id="react-status" role="status"></p>
</section>
</main>
<script>
const byId = id => document.getElementById(id);
const tabButtons = [...document.querySelectorAll('[data-game]')];
let activeGame = 'memory';
let cards = [], openCards = [], matched = new Set(), moves = 0, flipTimer;
const starButtons = [...byId('lanes').children];
let star = -1, starScore = 0, starDeadline = 0, starTimer, nextStar;
const signal = byId('signal');
let reactionState = 'idle', signalTimer, greenAt, best = Infinity;
try { best = Number(localStorage.getItem('shecodes-quick-color-best')) || Infinity; } catch {}

function renderMemory() {
  byId('memory-status').textContent = matched.size === cards.length
    ? 'All four pairs matched in ' + moves + ' moves!' : 'Pairs: ' + matched.size / 2 + ' / 4 · Moves: ' + moves;
  [...byId('tiles').children].forEach((button, index) => {
    const isMatch = matched.has(index), visible = isMatch || openCards.includes(index);
    button.textContent = visible ? cards[index] : '?';
    button.classList.toggle('matched', isMatch);
    button.setAttribute('aria-label', 'Card ' + (index + 1) + (visible ? ': ' + cards[index] : ', face down'));
    button.disabled = isMatch;
  });
}
function flip(index) {
  if (matched.has(index) || openCards.includes(index) || openCards.length === 2) return;
  openCards.push(index);
  if (openCards.length === 2) {
    moves++;
    const [first, second] = openCards;
    if (cards[first] === cards[second]) {
      matched.add(first); matched.add(second); openCards = [];
    } else {
      flipTimer = setTimeout(() => {openCards = []; renderMemory();}, 625);
    }
  }
  renderMemory();
}
function shuffle() {
  clearTimeout(flipTimer);
  cards = ['🍋','🍋','🪐','🪐','🎲','🎲','💎','💎'];
  for(let i=cards.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  matched = new Set(); openCards = []; moves = 0;
  renderMemory();
}
byId('tiles').replaceChildren(...Array.from({length:8},(_,index)=>{
  const button=document.createElement('button');
  button.type='button';
  button.addEventListener('click',()=>flip(index));
  return button;
}));
byId('shuffle').addEventListener('click',shuffle);
shuffle();

function renderStars() {
  starButtons.forEach((button,index)=>{
    button.textContent = index === star ? '★' : String(index+1);
    button.classList.toggle('active', index === star);
    button.setAttribute('aria-label', 'Lane ' + (index+1) + (index === star ? ', star' : ''));
  });
}
function stopStars(message) {
  clearInterval(starTimer);
  starDeadline=0; star=-1; renderStars();
  byId('start-stars').disabled=false;
  byId('star-status').textContent=message;
}
function moveStar() {
  star=(star+1+Math.floor(Math.random()*2))%3;
  nextStar=performance.now()+800;
  renderStars();
}
function startStars() {
  starScore=0;
  starDeadline=performance.now()+20000;
  byId('start-stars').disabled=true;
  byId('star-status').textContent='Caught: 0 · Time: 20s';
  moveStar();
  starTimer=setInterval(()=>{
    const now=performance.now();
    if(now>=starDeadline){stopStars('Time! You caught '+starScore+' stars.');return;}
    if(now>=nextStar)moveStar();
    byId('star-status').textContent='Caught: '+starScore+' · Time: '+Math.ceil((starDeadline-now)/1000)+'s';
  },100);
}
function catchStar(index) {
  if(!starDeadline||performance.now()>=starDeadline||index!==star)return;
  starScore++;
  moveStar();
}
starButtons.forEach((button,index)=>button.addEventListener('click',()=>catchStar(index)));
byId('start-stars').addEventListener('click',startStars);

function resetReaction(label='Start') {
  clearTimeout(signalTimer);
  reactionState='idle';
  signal.className=''; signal.textContent=label;
}
function react() {
  const status=byId('react-status');
  if(reactionState==='idle'){
    reactionState='waiting';
    signal.className='wait'; signal.textContent='Wait…'; status.textContent='';
    signalTimer=setTimeout(()=>{
      reactionState='green';signal.className='go';signal.textContent='Tap now!';greenAt=performance.now();
    },1200+Math.random()*2200);
  }else if(reactionState==='waiting'){
    resetReaction('Try again');status.textContent='Too early. Wait for green.';
  }else{
    const time=Math.round(performance.now()-greenAt);
    if(time<best){best=time;try{localStorage.setItem('shecodes-quick-color-best',String(best));}catch{}}
    resetReaction('Play again');status.textContent=time+' ms · Best '+best+' ms';
  }
}
signal.addEventListener('click',react);

function switchGame(name) {
  if(name===activeGame)return;
  if(starDeadline)stopStars('Round ended. Start again when you’re ready.');
  if(reactionState!=='idle')resetReaction();
  activeGame=name;
  for(const button of tabButtons){
    const show=button.dataset.game===name;
    button.setAttribute('aria-pressed', String(show));
    byId(button.dataset.game).hidden=!show;
  }
}
tabButtons.forEach(button=>button.addEventListener('click',()=>switchGame(button.dataset.game)));
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
  if(activeGame==='memory'&&/^[1-8]$/.test(event.key))flip(Number(event.key)-1);
  if(activeGame==='stars'&&/^[1-3]$/.test(event.key))catchStar(Number(event.key)-1);
  if(activeGame==='react'&&event.code==='Space'&&event.target.tagName!=='BUTTON'){event.preventDefault();react();}
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)return;
  if(starDeadline)stopStars('Round ended. Start again when you’re ready.');
  if(reactionState!=='idle')resetReaction();
});
</script>
</html>
